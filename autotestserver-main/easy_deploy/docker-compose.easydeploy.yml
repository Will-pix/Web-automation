services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hcdb
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - ./.env.easydeploy
    depends_on:
      - mysql
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../../autotestweb-main
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
